name: Opencast
options:
  bundleIdPrefix: com.opencast
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ARCHS: "arm64 x86_64"
    DEVELOPMENT_TEAM: "Z66C58Z3RC"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5

targets:
  Opencast:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Opencast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencast.app
        INFOPLIST_FILE: Opencast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Opencast/Opencast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: opencast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is isolated from the signed release: a distinct bundle id means a locally-run build
        # gets its own prefs, caches, TCC grants and login item instead of inheriting — and corrupting
        # — the installed app's state.
        Debug:
          PRODUCT_NAME: Opencast Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.opencast.app.dev
