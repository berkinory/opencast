name: Release

# Automatic releases require an owner version change. Manual dispatches republish the current version.
run-name: "Opencast release #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check owner version change
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "berkinory" ]; then
            echo "Skipping release: version changes are owner-only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n1)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::project.yml MARKETING_VERSION must be x.y.z; got '$new_version'"
              exit 1
            fi
            echo "Manually releasing $new_version"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_version="$(git show "$BEFORE:project.yml" 2>/dev/null | sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)"
          if [ "$old_version" = "$new_version" ]; then
            echo "Skipping release: MARKETING_VERSION did not change."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project.yml MARKETING_VERSION must be x.y.z; got '$new_version'"
            exit 1
          fi

          echo "Releasing $old_version → $new_version"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: release-gate
    if: needs.release-gate.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Read release metadata
        id: meta
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project.yml MARKETING_VERSION must be x.y.z; got '$VERSION'"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "display_name=Opencast"
            echo "bundle_id=com.opencast.app"
            echo "cask_name=opencast"
            echo "dmg_file=Opencast-${VERSION}.dmg"
            echo "zip_file=Opencast-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      # Import the Developer ID Application identity into an ephemeral keychain.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Build and package release archives
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          NOTARY_AUTH: api
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./build-dmg.sh

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          CHANGELOG_NOTES="$RUNNER_TEMP/changelog-notes.md"
          : > "$CHANGELOG_NOTES"

          if [ -f CHANGELOG.md ]; then
            awk -v version="$VERSION" '
              BEGIN {
                bracketed = "## [" version "]"
                plain = "## " version
              }
              !found && ($0 == bracketed || index($0, bracketed " ") == 1 || $0 == plain || index($0, plain " ") == 1) {
                found = 1
                next
              }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$CHANGELOG_NOTES"
          fi

          {
            if [ -s "$CHANGELOG_NOTES" ] && grep -q '[^[:space:]]' "$CHANGELOG_NOTES"; then
              cat "$CHANGELOG_NOTES"
              echo
            fi
            echo "## Requirements"
            echo
            echo "- macOS 15+"
            echo "- Intel or Apple Silicon CPU"
          } > dist/release-notes.md

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is required to publish updates."
            exit 1
          fi

          SPARKLE_VERSION="2.9.5"
          SPARKLE_DIR="$RUNNER_TEMP/Sparkle"
          APPCAST_DIR="$RUNNER_TEMP/appcast"
          mkdir -p "$SPARKLE_DIR" "$APPCAST_DIR"
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$SPARKLE_DIR"

          cp "dist/${ZIP_FILE}" "$APPCAST_DIR/${ZIP_FILE}"
          cp dist/release-notes.md "$APPCAST_DIR/Opencast-${VERSION}.md"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DIR/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --maximum-versions 1 \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/latest" \
            -o dist/appcast.xml \
            "$APPCAST_DIR"

          grep -q 'sparkle:edSignature=' dist/appcast.xml
          grep -q '<!-- sparkle-signatures:' dist/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: Opencast-${{ steps.meta.outputs.version }}
          path: |
            dist/${{ steps.meta.outputs.dmg_file }}
            dist/${{ steps.meta.outputs.zip_file }}
            dist/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.dmg_file }}" \
            "dist/${{ steps.meta.outputs.zip_file }}" \
            dist/appcast.xml \
            --title "Opencast ${VERSION}" \
            --notes-file dist/release-notes.md

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. Add it to enable auto-updates of the tap."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-brew.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi
